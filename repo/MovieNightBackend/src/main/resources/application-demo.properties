# Explicit, local-only feature-008 demo configuration. Launch with SPRING_CONFIG_LOCATION.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:mem:movienight_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.jwt.secret=${DEMO_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.tmdb.api-key=demo-only-key
app.tmdb.base-url=http://127.0.0.1:18081/3
app.tmdb.image-base-url=http://127.0.0.1:18081/images
app.omdb.api-key=
app.omdb.base-url=http://127.0.0.1:18081

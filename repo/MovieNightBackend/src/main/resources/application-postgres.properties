# Load explicitly with SPRING_CONFIG_LOCATION; do not load ignored development properties.
spring.datasource.url=${MN_DB_URL:}
spring.datasource.username=${MN_DB_USER:}
spring.datasource.password=${MN_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=movienight
spring.datasource.hikari.connection-timeout=5000
spring.jpa.properties.hibernate.default_schema=movienight
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=never
app.jwt.secret=${MN_JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.tmdb.api-key=${MN_TMDB_KEY:}
app.omdb.api-key=${MN_OMDB_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
# Avoid driver SQL details (including personal row values) and credential-bearing URLs.
logging.level.org.flywaydb=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

# Base configuration for all test runs
server.port=8080

spring.datasource.url=jdbc:h2:mem:movienightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

app.tmdb.api-key=
app.omdb.api-key=

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p
app.omdb.base-url=https://www.omdbapi.com

# Disable heavy 2.44-million-row similarity CSV insertion on fresh in-memory H2 test contexts
app.similarity.auto-load-on-startup=false

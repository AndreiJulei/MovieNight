# Explicit isolated baseline for the complete H2 suite; never imports local application.properties.
spring.datasource.url=jdbc:h2:mem:regression;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.jwt.secret=regression-only-synthetic-signing-secret-at-least-32-bytes
app.jwt.expiration-ms=86400000
app.tmdb.api-key=
app.omdb.api-key=

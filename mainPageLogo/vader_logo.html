<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night - Darth Vader Desktop Hero</title>
    <!-- Google Fonts: Anton (Marvel Heavy) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#6355ff',
                    },
                    fontFamily: {
                        anton: ['Anton', 'Impact', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #06070a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }

        .cinematic-glow {
            background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(99, 85, 255, 0.22) 0%, rgba(6, 7, 10, 0) 72%);
        }
        .text-glow-white {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.3), 0 15px 30px rgba(0, 0, 0, 0.95);
        }
        .text-glow-accent {
            text-shadow: 0 0 50px rgba(99, 85, 255, 0.65), 0 0 20px rgba(99, 85, 255, 0.4), 0 15px 30px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>

<body class="bg-[#06070a] text-white flex flex-col justify-start h-screen select-none">

    <!-- UPPER 70-75% DESKTOP HERO -->
    <div class="relative w-full h-[75vh] min-h-[560px] flex items-end justify-center overflow-hidden cinematic-glow border-b border-white/10">

        <!-- LOGO TEXT ROW (Behind Vader, shared baseline) -->
        <div class="absolute inset-x-0 bottom-[14%] flex items-baseline justify-center z-0 pointer-events-none tracking-tight font-anton uppercase">
            
            <!-- MOVIE (White) -->
            <span class="text-[14vw] lg:text-[160px] xl:text-[200px] font-black text-white text-glow-white leading-none inline-block origin-bottom transform scale-y-[1.35] translate-x-16 md:translate-x-24 lg:translate-x-28">
                MOVIE
            </span>

            <!-- Spacer for Darth Vader silhouette -->
            <div class="w-48 md:w-80 lg:w-[440px] flex-shrink-0"></div>

            <!-- NIGHT (Accent #6355ff) -->
            <span class="text-[14vw] lg:text-[160px] xl:text-[200px] font-black text-accent text-glow-accent leading-none inline-block origin-bottom transform scale-y-[1.35] -translate-x-16 md:-translate-x-24 lg:-translate-x-28">
                NIGHT
            </span>
        </div>

        <!-- DARTH VADER (Foreground Z-10) -->
        <div class="relative z-10 h-[94%] flex items-end justify-center pointer-events-none">
            <!-- Backlight halo -->
            <div class="absolute w-80 h-80 md:w-[480px] md:h-[480px] rounded-full bg-accent/20 blur-3xl -z-10 top-1/3"></div>

            <!-- Vader Cutout PNG -->
            <img 
                src="pngegg.png" 
                alt="Darth Vader"
                class="h-full w-auto object-contain filter drop-shadow-[0_25px_50px_rgba(0,0,0,0.98)]" 
            />
        </div>

        <!-- Bottom Fade -->
        <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-[#06070a] to-transparent z-20 pointer-events-none"></div>
    </div>

    <!-- Quick link to interactive studio -->
    <div class="p-4 text-center text-xs text-white/40">
        Darth Vader Desktop Hero Banner (75vh) • To customize fonts, stretch, colors, and characters, open <a href="index.html" class="text-accent underline font-semibold hover:text-white">index.html</a>
    </div>

</body>

</html>

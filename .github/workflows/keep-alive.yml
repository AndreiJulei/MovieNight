name: Keep alive

# Free-tier hosting sleeps when idle: Render stops the backend after ~15 min without requests,
# and Supabase pauses a project after ~7 days without database activity. This ping requests an
# endpoint that queries the database (a 404 for a missing title is the expected answer), which
# keeps both awake. GitHub may delay scheduled runs, so the interval leaves headroom.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend (and through it, the database)
        run: |
          code=$(curl --silent --output /dev/null --max-time 120 --retry 2 --retry-delay 10 \
            --write-out '%{http_code}' 'https://movienight-backend-zye9.onrender.com/api/movies/1' || true)
          echo "backend answered HTTP ${code}"
          # 404 is expected (no such title). Fail only if the service is unreachable or erroring.
          case "$code" in 000|5*) exit 1 ;; esac
